<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sin título: Paint (Server-Infinit + Chat)</title>
  <style>
    /* ── DISEÑO DE INTERFAZ INTEGRAL AERO / WINDOWS 7 ── */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 12px; background: #eed; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    /* Barra de Título Aero */
    #title-bar { background: linear-gradient(to bottom, #ebf3fe 0%, #cfe0f7 40%, #b9d2f3 100%); height: 32px; border-bottom: 1px solid #90a8c6; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; position: relative; }
    .title-left-group { display: flex; align-items: center; gap: 4px; }
    .title-icon { width: 16px; height: 16px; background: url('https://win7games.com/images/paint.png') no-repeat center/contain; margin-right: 4px; }
    
    .quick-access-bar { display: flex; align-items: center; gap: 6px; margin-right: 12px; padding-right: 8px; border-right: 1px solid rgba(0,0,0,0.15); }
    .quick-btn { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 2px; border: 1px solid transparent; font-size: 13px; }
    .quick-btn:hover { background: rgba(255,255,255,0.6); border-color: #a0b0c5; }
    .title-text { font-weight: 500; color: #1e395b; font-size: 12px; }

    .window-controls { display: flex; height: 100%; align-items: flex-start; }
    .win-btn { width: 45px; height: 22px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; font-size: 14px; font-family: monospace; color: #4c4c4c; cursor: pointer; border-bottom-left-radius: 3px; border-bottom-right-radius: 3px; }
    .win-btn:hover { background: rgba(255, 255, 255, 0.4); }
    .win-btn.close-btn:hover { background: #e81123; color: white; }

    #network-status { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #3e5675; margin-right: 15px; background: rgba(255,255,255,0.4); padding: 2px 8px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.05); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #e81123; box-shadow: 0 0 3px #e81123; }
    .status-dot.online { background: #107c41; box-shadow: 0 0 5px #107c41; }
    .status-dot.saving { background: #ffb900; box-shadow: 0 0 5px #ffb900; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Estructura Ribbon */
    #ribbon { background: #f2f5f9; border-bottom: 1px solid #b9c9da; display: flex; flex-direction: column; position: relative; z-index: 100; }
    #ribbon-tabs { display: flex; padding-left: 4px; background: linear-gradient(to bottom, #f5f8fc, #e3ecf7); border-bottom: 1px solid #cbd9e9; height: 30px; align-items: flex-end; }
    .tab { padding: 4px 16px; border: 1px solid transparent; border-bottom: none; border-top-left-radius: 4px; border-top-right-radius: 4px; color: #333; cursor: pointer; font-size: 12px; margin-bottom: -1px; height: 25px; display: flex; align-items: center; }
    .tab:hover { background: rgba(255,255,255,0.5); }
    .tab.active { background: #f2f5f9; border-color: #b9c9da; border-bottom: 1px solid #f2f5f9; font-weight: bold; position: relative; z-index: 5; color: #000; }
    
    /* MODIFICACIÓN: Desaparecer botón de Archivo permanentemente */
    .tab-file { display: none !important; } 

    .ribbon-panel { display: none; height: 98px; padding: 4px; gap: 2px; background: linear-gradient(to bottom, #f5f8f9 0%, #e6ecf5 100%); }
    .ribbon-panel.active { display: flex; }
    .ribbon-group { border-right: 1px solid #d9e3f0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 0 6px; position: relative; }
    .ribbon-group-title { font-size: 10px; color: #66788f; margin-top: auto; padding-top: 2px; text-align: center; width: 100%; border-top: 1px solid transparent; }
    .ribbon-controls { display: flex; gap: 4px; align-items: center; flex-grow: 1; }

    .tool-grid { display: grid; grid-template-columns: repeat(3, 26px); gap: 2px; }
    .tool-grid-btn { border: 1px solid transparent; background: transparent; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 2px; font-size: 14px; }
    .tool-grid-btn:hover { background: #eaf2fb; border-color: #b8d6fb; }
    .tool-grid-btn.active { background: #cce4f7; border-color: #a4c9eb; box-shadow: inset 0 0 2px rgba(0,0,0,0.1); }

    .tool-btn-large { border: 1px solid transparent; background: transparent; padding: 4px; border-radius: 3px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 48px; height: 68px; }
    .tool-btn-large:hover { background: #eaf2fb; border-color: #b8d6fb; }
    .tool-btn-large.active { background: #cce4f7; border-color: #a4c9eb; }
    .tool-btn-large .icon { font-size: 24px; line-height: 1; }
    .tool-btn-large span { font-size: 11px; margin-top: 4px; color: #222; text-align: center; }

    #size-selector { display: flex; flex-direction: column; gap: 5px; width: 65px; padding: 4px; background: white; border: 1px solid #cbd5e1; border-radius: 2px; }
    .size-option { height: 12px; display: flex; align-items: center; cursor: pointer; padding: 2px; border: 1px solid transparent; width: 100%; }
    .size-option:hover { background: #eaf2fb; border-color: #b8d6fb; }
    .size-option.active { background: #cce4f7; border-color: #a4c9eb; }
    .size-line { background: #111; width: 100%; border-radius: 1px; }

    .color-section { display: flex; gap: 8px; align-items: center; }
    .color-boxes-stack { display: flex; position: relative; width: 48px; height: 48px; margin-right: 4px; }
    .color-preview-box { width: 28px; height: 28px; border: 1px solid #7a7a7a; position: absolute; box-shadow: 1px 1px 2px rgba(0,0,0,0.1); cursor: pointer; }
    #color1-box { background: #000000; top: 0; left: 0; z-index: 10; }
    #color2-box { background: #ffffff; bottom: 0; right: 0; z-index: 5; }
    .color-preview-box.active { border: 2px solid #307ec9; z-index: 12; }
    
    .color-grid { display: grid; grid-template-columns: repeat(10, 15px); grid-template-rows: repeat(2, 15px); gap: 3px; }
    .color-cell { width: 15px; height: 15px; border: 1px solid #a0a0a0; cursor: pointer; border-radius: 1px; }
    .color-cell:hover { transform: scale(1.2); z-index: 20; box-shadow: 0 0 3px rgba(0,0,0,0.5); }

    /* Entorno de Trabajo Dividido (Lienzo + Chat) */
    #main-content { display: flex; flex-grow: 1; overflow: hidden; }

    #workspace { flex-grow: 1; background: #cbd3e3; overflow: auto; display: flex; justify-content: flex-start; align-items: flex-start; padding: 15px; position: relative; }
    #canvas-container { background: white; box-shadow: 3px 3px 10px rgba(0,0,0,0.2); position: relative; border: 1px solid #6d7b93; display: inline-block; transform-origin: top left; transition: transform 0.1s ease-out; }
    canvas { display: block; cursor: crosshair; background: #ffffff; }

    /* Chat de la Sala */
    #chat-sidebar { width: 280px; background: #f0f4f9; border-left: 1px solid #b9c9da; display: flex; flex-direction: column; }
    #chat-header { background: linear-gradient(to bottom, #1b5fa7, #2679c1); color: white; padding: 6px 10px; font-weight: bold; font-size: 11px; display: flex; justify-content: space-between; }
    #chat-messages { flex-grow: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
    .msg-bubble { background: white; padding: 6px 8px; border-radius: 4px; border: 1px solid #d9e3f0; align-self: flex-start; max-width: 90%; word-wrap: break-word; }
    .msg-bubble.self { background: #dcf8c6; border-color: #c4e6b0; align-self: flex-end; }
    .msg-user { font-size: 9px; font-weight: bold; color: #1e395b; margin-bottom: 2px; }
    #chat-input-container { padding: 8px; background: #e5edf6; border-top: 1px solid #d9e3f0; display:flex; gap:5px; }
    #chat-input { flex-grow: 1; padding: 5px; border: 1px solid #b9c9da; border-radius: 2px; outline: none; }
    #chat-input:focus { border-color: #2679c1; }

    /* Cursores Remotos */
    #cursors-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999; }
    .remote-cursor { position: absolute; top: 0; left: 0; pointer-events: none; width: 14px; height: 20px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black"><path d="M4.5,2v17.5l4.8-4.7l3.6,8.2l3.2-1.4l-3.6-8.2h6L4.5,2z"/></svg>') no-repeat; z-index: 100000; filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.4)); transform: translate3d(0, 0, 0); will-change: transform; transition: opacity 0.2s; }
    .remote-label { position: absolute; top: 16px; left: 12px; background: #1e395b; color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 3px; white-space: nowrap; box-shadow: 1px 1px 3px rgba(0,0,0,0.2); }

    /* Barra de Estado Inferior */
    #status-bar { height: 24px; background: #f2f5f9; border-top: 1px solid #b9c9da; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; color: #333; font-size: 11px; z-index: 101; }
    .status-left { display: flex; align-items: center; gap: 15px; }
    .status-field { display: flex; align-items: center; gap: 6px; border-right: 1px solid #d9e3f0; padding-right: 15px; min-width: 100px; }
    
    /* Login */
    #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(180, 200, 220, 0.4); backdrop-filter: blur(2px); z-index: 999999; display: flex; align-items: center; justify-content: center; }
    .window-modal { background: #f0f0f0; border: 1px solid #666; box-shadow: 0 8px 24px rgba(0,0,0,0.3); border-radius: 5px; width: 380px; overflow: hidden; display: flex; flex-direction: column; }
    .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .modal-input { padding: 6px 10px; border: 1px solid #abc; border-radius: 3px; font-family: inherit; font-size: 12px; }
    .modal-input:focus { border-color: #358be9; outline: none; }
    .modal-btn { padding: 8px; background: linear-gradient(to bottom, #fafafa, #eaeaea); border: 1px solid #707070; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 12px; color: #111; }
  </style>
</head>
<body>

  <div id="title-bar">
    <div class="title-left-group">
      <div class="title-icon"></div>
      <div class="quick-access-bar">
        <div class="quick-btn" title="Guardar">💾</div>
        <div class="quick-btn" title="Deshacer (Local)">↩️</div>
      </div>
      <div class="title-text" id="window-title">Sin título: Paint (Server-Infinit Aisaldo)</div>

      <div id="network-status" title="Indicador de guardado en servidor">
        <div id="status-indicator" class="status-dot"></div>

  <div id="ribbon">
    <div id="ribbon-tabs">
      <div class="tab tab-file">Archivo</div>
      <div class="tab active" id="tab-home-trigger">Inicio</div>
      <div class="tab" id="tab-view-trigger">Ver</div>
    </div>
    
    <div id="panel-home" class="ribbon-panel active">
      <div class="ribbon-group">
        <div class="ribbon-controls">
          <div class="tool-grid">
            <button class="tool-grid-btn active" id="tool-pencil" title="Lápiz">✏️</button>
            <button class="tool-grid-btn" id="tool-bucket" title="Relleno con color">🪣</button>

          </div>

            <span>Rectángulo</span>
          </button>
          <button class="tool-btn-large" id="shape-circle">
            <div style="width:20px; height:20px; border:2px solid #333; border-radius:50%; margin:2px;"></div>

            <div class="size-option" data-size="24"><div class="size-line" style="height: 10px;"></div></div>
          </div>

      <div class="ribbon-group" style="border-right: none;">
        <div class="ribbon-controls color-section">
          <div class="color-boxes-stack">

            <div id="color2-box" class="color-preview-box"></div>
          </div>
          <div class="color-grid" id="palette"></div>
        </div>
        <div class="ribbon-group-title">Colores</div>
      </div>

    <div id="panel-view" class="ribbon-panel">
      <div class="ribbon-group" style="border-right:none;">
        <div class="ribbon-controls" style="flex-direction:column; align-items:flex-start; gap:6px; padding:0 10px;">
          <label><input type="checkbox" checked id="chk-chat"> Panel de Chat</label>
        </div>
        <div class="ribbon-group-title">Mostrar u ocultar</div>
      </div>
    </div>
  </div>

  <div id="main-content">
    <div id="workspace">
      <div id="canvas-container">
        <canvas id="paintCanvas" width="960" height="540"></canvas>
        <div id="cursors-layer"></div>
      </div>
    </div>

    <div id="chat-sidebar">
      <div id="chat-header"><span>Chat de la Sala</span><span id="chat-room-name"></span></div>
      <div id="chat-messages">
        <div style="text-align:center; color:#aaa; font-style:italic;">Bienvenido al chat aislado.</div>
      </div>
      <div id="chat-input-container">
        <input type="text" id="chat-input" placeholder="Escribe un mensaje...">

  <div id="status-bar">
    <div class="status-left">
      <div class="status-field">📍 <span id="coords-display">0, 0px</span></div>
      <div class="status-field">💾 DB Mágica: <span id="db-status" style="color:#107c41; font-weight:bold;">Espera...</span></div>

    </div>
  </div>

  <div id="login-overlay">
    <div class="window-modal">
      <div id="title-bar" style="border-radius: 4px 4px 0 0;"><div class="title-text">Entrada con Aislamiento xd</div></div>
      <div class="modal-body">
        <label style="font-weight:600;">Tu Apodo:</label>
        <input type="text" id="net-username" class="modal-input" value="DibujantePro" maxlength="15">
        
        <label style="font-weight:600;">Nombre de la Sala (Aisla la DB y el Chat):</label>
        <input type="text" id="net-room" class="modal-input" value="sala_epica_1">
        
        <button id="btn-connect" class="modal-btn" style="margin-top:8px;">Conectar a Sala Aislada</button>
      </div>
    </div>
  </div>

  <script>
    // ── CONFIGURACIÓN DE SERVER-INFINIT ──
    const INFINIT_API_KEY = '68cbaf8483807fd1254db8e893d293b03430e0ca';
    const INFINIT_URL = 'https://ikelene.dev/storage/';
    const YYF_UPLOAD = 'https://yyf.mubilop.com/api/upload';

    // Estados Locales
    const state = {
      tool: 'pencil',
      color1: '#000000',
      color2: '#ffffff',
      activeColorTarget: 'color1',
      size: 2,
      isDrawing: false,
      startX: 0, startY: 0,
      username: '', room: '',
      isCanvasDirty: false,
      isSavingProcessActive: false
    };

    const win7Colors = ['#000000', '#7f7f7f', '#880015', '#ed1c24', '#ff7f27', '#fff200', '#22b14c', '#00a2e8', '#3f48cc', '#a349a4', '#ffffff', '#c3c3c3', '#b5e61d', '#ffc90e', '#ffeaec', '#efe4b0', '#b5e61d', '#7092be', '#c8bfe7', '#ffffff'];
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const cursorsLayer = document.getElementById('cursors-layer');

    // Paleta
    win7Colors.forEach(color => {
      const cell = document.createElement('div');
      cell.className = 'color-cell'; cell.style.background = color;
      cell.onclick = () => {
        if (state.activeColorTarget === 'color1') { state.color1 = color; document.getElementById('color1-box').style.background = color; } 
        else { state.color2 = color; document.getElementById('color2-box').style.background = color; }
      };
      document.getElementById('palette').appendChild(cell);
    });

    document.getElementById('color1-box').onclick = () => { document.getElementById('color2-box').classList.remove('active'); document.getElementById('color1-box').classList.add('active'); state.activeColorTarget = 'color1'; };
    document.getElementById('color2-box').onclick = () => { document.getElementById('color1-box').classList.remove('active'); document.getElementById('color2-box').classList.add('active'); state.activeColorTarget = 'color2'; };

    // Pestañas
    document.getElementById('tab-home-trigger').onclick = (e) => { document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.querySelectorAll('.ribbon-panel').forEach(p=>p.classList.remove('active')); e.target.classList.add('active'); document.getElementById('panel-home').classList.add('active'); };
    document.getElementById('tab-view-trigger').onclick = (e) => { document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.querySelectorAll('.ribbon-panel').forEach(p=>p.classList.remove('active')); e.target.classList.add('active'); document.getElementById('panel-view').classList.add('active'); };
    document.getElementById('chk-chat').onchange = (e) => { document.getElementById('chat-sidebar').style.display = e.target.checked ? 'flex' : 'none'; };

    // Herramientas
    function setTool(toolName, el) { state.tool = toolName; document.querySelectorAll('.tool-grid-btn, .tool-btn-large').forEach(b=>b.classList.remove('active')); if(el) el.classList.add('active'); }
    document.getElementById('tool-pencil').onclick = (e) => setTool('pencil', e.target);
    document.getElementById('tool-eraser').onclick = (e) => setTool('eraser', e.target);
    document.getElementById('tool-bucket').onclick = (e) => setTool('bucket', e.target);
    document.getElementById('tool-picker').onclick = (e) => setTool('picker', e.target);
    document.getElementById('tool-line').onclick = (e) => setTool('line', e.target);
    document.getElementById('shape-rect').onclick = (e) => setTool('rect', e.currentTarget);
    document.getElementById('shape-circle').onclick = (e) => setTool('circle', e.currentTarget);
    document.getElementById('tool-clear').onclick = () => { if(confirm("¿Borrar lienzo para todos?")) { executeClear(); network.sendDrawAction({ type: 'clear' }); markCanvasDirty(); } };

    document.querySelectorAll('#size-selector .size-option').forEach(opt => {
      opt.onclick = (e) => { document.querySelectorAll('#size-selector .size-option').forEach(o=>o.classList.remove('active')); e.currentTarget.classList.add('active'); state.size = parseInt(e.currentTarget.getAttribute('data-size')); };
    });

    let snapshot = null;
    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: Math.round((e.clientX - rect.left) * (canvas.width / rect.width)), y: Math.round((e.clientY - rect.top) * (canvas.height / rect.height)) };
    }

    // ── LÓGICA DE DIBUJO ──
    function markCanvasDirty() { state.isCanvasDirty = true; }

    function drawLineLocal(x0, y0, x1, y1, color, size, isEraser = false) {
      ctx.beginPath(); ctx.lineWidth = size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (isEraser) { ctx.strokeStyle = state.color2; ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); return; }
      ctx.strokeStyle = color; ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }

    function drawShapeLocal(type, x0, y0, x1, y1, color, size) {
      ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = size; ctx.lineCap = 'round';
      if (type === 'line') { ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); } 
      else if (type === 'rect') { ctx.rect(x0, y0, x1 - x0, y1 - y0); } 
      else if (type === 'circle') { let r = Math.sqrt(Math.pow(x1-x0,2)+Math.pow(y1-y0,2)); ctx.arc(x0, y0, r, 0, 2*Math.PI); }
      ctx.stroke();
    }

    function executeClear() { ctx.fillStyle = state.color2; ctx.fillRect(0, 0, canvas.width, canvas.height); }

    function floodFill(startX, startY, fillColor) {
      const targetColor = ctx.getImageData(startX, startY, 1, 1).data;
      const fillRGB = hexToRgb(fillColor);
      if (targetColor[0]===fillRGB[0] && targetColor[1]===fillRGB[1] && targetColor[2]===fillRGB[2]) return;
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data; const queue = [[startX, startY]];
      while (queue.length > 0) {
        const [x, y] = queue.pop(); const pos = (y * canvas.width + x) * 4;
        if (data[pos]===targetColor[0] && data[pos+1]===targetColor[1] && data[pos+2]===targetColor[2]) {
          data[pos] = fillRGB[0]; data[pos+1] = fillRGB[1]; data[pos+2] = fillRGB[2]; data[pos+3] = 255;
          if (x > 0) queue.push([x - 1, y]); if (x < canvas.width - 1) queue.push([x + 1, y]);
          if (y > 0) queue.push([x, y - 1]); if (y < canvas.height - 1) queue.push([x, y + 1]);
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }
    function hexToRgb(hex) { var c = hex.substring(1).match(/.{1,2}/g); return [parseInt(c[0],16), parseInt(c[1],16), parseInt(c[2],16)]; }

    // Eventos Mouse
    canvas.onmousedown = (e) => {
      if (!network.connected) return;
      let activeColor = (e.button === 2) ? state.color2 : state.color1;
      state.isDrawing = true; const coords = getCoords(e); state.startX = coords.x; state.startY = coords.y;
      snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
      
      if (state.tool === 'bucket') {
        floodFill(state.startX, state.startY, activeColor);
        network.sendDrawAction({ type: 'bucket', x: state.startX, y: state.startY, color: activeColor });
        state.isDrawing = false; markCanvasDirty();
      } else if (state.tool === 'picker') {
        const d = ctx.getImageData(state.startX, state.startY, 1, 1).data;
        const hex = "#" + ((1<<24)+(d[0]<<16)+(d[1]<<8)+d[2]).toString(16).slice(1);
        if(state.activeColorTarget === 'color1') { state.color1 = hex; document.getElementById('color1-box').style.background = hex; } 
        else { state.color2 = hex; document.getElementById('color2-box').style.background = hex; }
        state.isDrawing = false;
      }
    };
    canvas.oncontextmenu = (e) => e.preventDefault();
    canvas.onmousemove = (e) => {
      const coords = getCoords(e); document.getElementById('coords-display').innerText = `${coords.x}, ${coords.y}px`;
      if (network.connected) network.sendCursor(coords.x, coords.y);
      if (!state.isDrawing) return;
      let activeColor = (e.buttons === 2) ? state.color2 : state.color1;
      
      if (state.tool === 'pencil' || state.tool === 'eraser') {
        drawLineLocal(state.startX, state.startY, coords.x, coords.y, activeColor, state.size, state.tool === 'eraser');
        network.sendDrawAction({ type: 'line', x0: state.startX, y0: state.startY, x1: coords.x, y1: coords.y, color: activeColor, size: state.size, eraser: (state.tool === 'eraser') });
        state.startX = coords.x; state.startY = coords.y;
        markCanvasDirty();
      } else if (['line', 'rect', 'circle'].includes(state.tool)) {
        ctx.putImageData(snapshot, 0, 0);
        drawShapeLocal(state.tool, state.startX, state.startY, coords.x, coords.y, activeColor, state.size);
      }
    };
    canvas.onmouseup = (e) => {
      if (!state.isDrawing) return;
      state.isDrawing = false; const coords = getCoords(e);
      let activeColor = (e.button === 2) ? state.color2 : state.color1;
      if (['line', 'rect', 'circle'].includes(state.tool)) {
        network.sendDrawAction({ type: 'shape', shapeType: state.tool, x0: state.startX, y0: state.startY, x1: coords.x, y1: coords.y, color: activeColor, size: state.size });
        markCanvasDirty();
      }
    };
    canvas.onmouseleave = () => state.isDrawing = false;

    // ── INTERCONEXIÓN AISLADA CLOUD32 (EL TRUCO xd) ──
    class Cloud32NetworkClient {
      constructor() { this.ws = null; this.connected = false; this.remoteCursors = {}; }
      connect(user, room) {
        state.username = user; state.room = room;
        document.getElementById('room-display').innerText = room;
        document.getElementById('chat-room-name').innerText = `[${room}]`;
        this.ws = new WebSocket('wss://cloud-link-server--jere32game.replit.app');
        this.ws.onopen = () => {
          this.connected = true;
          document.getElementById('status-indicator').className = 'status-dot online';
          document.getElementById('network-text').innerText = `En línea`;
          document.getElementById('window-title').innerText = `${room} - Paint Infinit`;
          this._send({ cmd: 'setid', val: state.username });
          this._send({ cmd: 'link', val: [state.room] }); // Intento normal del server
        };
        this.ws.onmessage = (evt) => {
          try {
            const msg = JSON.parse(evt.data);
            if (msg.cmd === 'ulist') { document.getElementById('client-count-badge').innerText = `(${Array.isArray(msg.val) ? msg.val.length : 1})`; return; }
            if (msg.cmd === 'gmsg') {
              const sender = msg.origin?.username || 'Invitado';
              if (sender === state.username) return;
              
              const p = JSON.parse(msg.val);
              
              // EL TRUCO ESTÁ AQUÍ: Si el paquete no tiene tu misma sala, lo ignoramos por completo
              if (p.room !== state.room) return; 

              if (p.n7_action === 'cursor') { this.syncCursor(sender, p.x, p.y); }
              else if (p.n7_action === 'draw') {
                const d = p.data;
                if (d.type === 'line') drawLineLocal(d.x0, d.y0, d.x1, d.y1, d.color, d.size, d.eraser);
                else if (d.type === 'shape') drawShapeLocal(d.shapeType, d.x0, d.y0, d.x1, d.y1, d.color, d.size);
                else if (d.type === 'bucket') floodFill(d.x, d.y, d.color);
                else if (d.type === 'clear') executeClear();
              }
              else if (p.n7_action === 'chat') { appendChatMsg(sender, p.text); }
            }
          } catch(e) {}
        };
        this.ws.onclose = () => {
          this.connected = false; document.getElementById('status-indicator').className = 'status-dot';
          document.getElementById('network-text').innerText = "Desconectado";
        };
      }
      _send(obj) { if (this.ws && this.ws.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(obj)); }
      
      // EL TRUCO ESTÁ AQUÍ TAMBIÉN: Añadimos `room: state.room` a todos los paquetes salientes
      sendDrawAction(d) { this._send({ cmd: 'gmsg', val: JSON.stringify({ n7_action: 'draw', room: state.room, data: d }) }); }
      sendCursor(x, y) { this._send({ cmd: 'gmsg', val: JSON.stringify({ n7_action: 'cursor', room: state.room, x, y }) }); }
      sendChat(txt) { this._send({ cmd: 'gmsg', val: JSON.stringify({ n7_action: 'chat', room: state.room, text: txt }) }); }

      syncCursor(user, x, y) {
        let node = this.remoteCursors[user];
        if (!node) {
          node = document.createElement('div'); node.className = 'remote-cursor';
          const lbl = document.createElement('div'); lbl.className = 'remote-label'; lbl.innerText = user;
          node.appendChild(lbl); cursorsLayer.appendChild(node); this.remoteCursors[user] = node;
        }
        node.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        clearTimeout(node.killTimeout); node.style.opacity = "1";
        node.killTimeout = setTimeout(() => { node.style.opacity = "0"; }, 4000);
      }
    }
    const network = new Cloud32NetworkClient();

    // ── LÓGICA DE CHAT UI ──
    const chatContainer = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    function appendChatMsg(user, text, isSelf=false) {
      const b = document.createElement('div'); b.className = `msg-bubble ${isSelf ? 'self' : ''}`;
      const u = document.createElement('div'); u.className = 'msg-user'; u.innerText = user;
      const t = document.createElement('span'); t.innerText = text;
      b.appendChild(u); b.appendChild(t); chatContainer.appendChild(b);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    function handleSendChat() {
      const txt = chatInput.value.trim();
      if(txt) { network.sendChat(txt); appendChatMsg(state.username, txt, true); chatInput.value = ''; }
    }
    document.getElementById('btn-send-chat').onclick = handleSendChat;
    chatInput.onkeydown = (e) => { if(e.key === 'Enter') handleSendChat(); };

    // ── LÓGICA DE PERSISTENCIA SERVER-INFINIT (GUARDADO AISLADO) ──
    async function loadRoomImage(roomName) {
      document.getElementById('btn-connect').innerText = "Descargando DB Aislada...";
      try {
        // EL TRUCO xd: Leer usando el nombre de la sala como variable de base de datos
        const res = await fetch(INFINIT_URL + 'get.php', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey: INFINIT_API_KEY, key: `PAINT_ROOM_${roomName}` })
        });
        const d = await res.json();
        if (d.success && d.data && d.data.value) {
          const url = d.data.value;
          if (url.startsWith('http')) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => { ctx.drawImage(img, 0, 0); };
            img.src = url;
          }
        }
      } catch (e) { console.error("Error al cargar db:", e); }
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('btn-connect').innerText = "Conectar a Sala Aislada";
    }

    async function saveRoomImage() {
      if (state.isSavingProcessActive || !state.isCanvasDirty || !state.room) return;
      
      state.isSavingProcessActive = true;
      state.isCanvasDirty = false;
      
      document.getElementById('status-indicator').className = 'status-dot saving';
      document.getElementById('db-status').innerText = 'Guardando DB...';
      
      try {
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const fd = new FormData(); fd.append('file', blob, 'master_canvas.png');
        
        const yyfRes = await fetch(YYF_UPLOAD, { method: 'POST', body: fd });
        const yyfData = await yyfRes.json();
        
        // EL TRUCO xd: El link puro en vez del Data URL (así no se crashea el navegador), escrito en la variable de la sala.
        const masterLink = 'https://yyf.mubilop.com' + yyfData.fileUrl; 
        
        await fetch(INFINIT_URL + 'store.php', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey: INFINIT_API_KEY, key: `PAINT_ROOM_${state.room}`, value: masterLink, mimeType: 'text/plain' })
        });
        document.getElementById('db-status').innerText = 'Guardado OK';
      } catch(e) {
        state.isCanvasDirty = true;
        document.getElementById('db-status').innerText = 'Error al guardar';
      }
      
      state.isSavingProcessActive = false;
      setTimeout(() => { if(!state.isSavingProcessActive) document.getElementById('status-indicator').className = 'status-dot online'; }, 1000);
    }

    setInterval(saveRoomImage, 2000);

    // Evento Formulario
    document.getElementById('btn-connect').onclick = async () => {
      const user = document.getElementById('net-username').value.trim();
      const room = document.getElementById('net-room').value.trim();
      if (!user || !room) { alert("Completa los datos crack."); return; }
      
      executeClear(); 
      await loadRoomImage(room);
      network.connect(user, room);
    };

    executeClear();
  </script>
